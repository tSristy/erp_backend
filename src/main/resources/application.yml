spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/enterpriseDB
    username: postgres
    password: ${DB_PASSWORD:0p3n}
    driver-class-name: org.postgresql.Driver

    hikari:
      pool-name: EnterpriseHikariCP
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 30000
      connection-timeout: 30000
      auto-commit: false

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 6s

jwt:
  secret: ${JWT_SECRET:CHANGE_THIS_TO_LONG_256_BIT_SECRET_KEY}
  access-expiration: 900000
  refresh-expiration: 604800000